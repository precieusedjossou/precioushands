<style>
:root{
  --bg:#FFFFFF; --panel:#F6EEE4; --line:#E8DFD1; --ink:#241C1A; --muted:#8A7A65;
  --accent:#6E0F1F; --gold:#B08D57; --card:#FFFFFF;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cinzel',Georgia,serif;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}
a{color:inherit;text-decoration:none;cursor:pointer;}
.script{font-family:'Allura',cursive;}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:0.5px solid var(--line);position:sticky;top:env(safe-area-inset-top,0);background:var(--bg);z-index:10;gap:14px;}
.burger{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink);order:-1;}
.nav-close{display:none;}
@media(max-width:560px){
  .burger{display:block;}
  #main-nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);z-index:50;flex-direction:column;align-items:center;padding:22px;gap:18px;font-size:13px;box-shadow:0 12px 20px rgba(0,0,0,.12);border-bottom:0.5px solid var(--line);}
  #main-nav.open{display:flex;}
  .nav-close{display:none;}
  header{position:sticky;}
  header>div:last-child{margin-left:auto;}
}
.logo{display:flex;align-items:center;gap:8px;font-size:20px;}
.logo img{height:34px;}
nav{display:flex;gap:16px;font-size:10px;letter-spacing:1px;color:var(--muted);flex-wrap:wrap;text-transform:uppercase;}
nav a.active,nav a:hover{color:var(--accent);}
.cart-btn{font-size:10px;border:0.5px solid var(--line);padding:6px 12px;border-radius:20px;white-space:nowrap;letter-spacing:1px;}
main{max-width:1100px;margin:0 auto;padding:0 24px;}
.hero{background:linear-gradient(rgba(36,20,20,.35),rgba(36,20,20,.45)), var(--img-hero,none) center/cover no-repeat #4A2A2A;padding:150px 20px;text-align:center;width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;color:#fff;}
.hero p{color:rgba(255,255,255,.85) !important;}
@media(max-width:480px){.hero{padding:50px 16px;}}
.hero .kicker{font-size:11px;letter-spacing:2px;color:var(--accent);margin-bottom:10px;text-transform:uppercase;}
.hero h1{font-size:clamp(28px,7vw,44px);margin:0 0 10px;font-weight:400;}
.hero p{font-size:12px;color:var(--muted);letter-spacing:1px;margin:0 0 22px;text-transform:uppercase;}
.btn{display:inline-block;border:1.5px solid var(--accent);background:transparent;color:var(--accent);padding:11px 30px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;border-radius:30px 6px 30px 6px;transition:border-radius .3s ease,background .3s ease,color .3s ease;}
.btn:hover{border-radius:6px 30px 6px 30px;background:var(--accent);color:#fff;}
.btn.solid{background:var(--accent);color:#fff;border:none;}
.btn.solid:hover{background:#4E0A15;}
.banner.dark .btn:hover{background:#fff;color:var(--accent);}
.hero .btn{border-color:#fff;color:#fff;}
.hero .btn:hover{background:#fff;color:var(--accent);}
.section-title{font-size:clamp(19px,4.5vw,26px);text-align:center;margin:0 0 6px;font-weight:400;}
.section-kicker{text-align:center;font-family:'Allura',cursive;font-size:24px;color:var(--accent);margin-bottom:2px;}
.strip-wrap{overflow:hidden;padding:30px 0;}
.strip{display:flex;gap:14px;width:max-content;animation:strip-scroll 18s linear infinite;}
.strip .thumb{flex:0 0 140px;height:140px;}
@keyframes strip-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px;margin-top:26px;}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);gap:12px;}}
.card{cursor:pointer;background:var(--card);}
.thumb{background:var(--panel);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);overflow:hidden;}
.card p{margin:10px 2px 0;font-size:12px;}
.card .sub{font-size:10px;color:var(--muted);margin:2px 0 0;}
.card .price{color:var(--accent);font-size:11px;margin-top:4px;}
.badge{position:absolute;background:var(--accent);color:#fff;font-size:8px;letter-spacing:1px;padding:3px 8px;margin:8px;text-transform:uppercase;}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:30px;}
.cat-card{position:relative;height:320px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border-radius:50% 50% 10% 10% / 55% 55% 8% 8%;padding-bottom:22px;background-size:cover;background-position:center;}
.cat-card.cat-femme{background-image:var(--img-femme,none);}
.cat-card.cat-homme{background-image:var(--img-homme,none);}
.cat-card.cat-enfant{background-image:var(--img-enfant,none);}
@media(max-width:560px){.cat-grid{gap:6px;}.cat-card{height:190px;padding-bottom:12px;}.cat-card span{font-size:18px !important;padding:4px 12px !important;}}
@media(max-width:380px){.cat-card{height:160px;}}
.cat-card span{font-family:'Allura',cursive;font-size:30px;color:#fff;background:rgba(43,36,30,.45);padding:6px 26px;position:relative;z-index:2;}
.subcat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:26px;}
@media(max-width:700px){.subcat-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:420px){.subcat-grid{grid-template-columns:1fr;}}
.subcat-card .thumb{height:140px;}
.subcat-card p{margin:10px 0 2px;font-size:12px;font-weight:600;}
.subcat-card .desc{font-size:10px;color:var(--muted);margin:0 0 4px;}
.subcat-card .explore{font-size:10px;color:var(--accent);letter-spacing:.5px;text-transform:uppercase;}
.banner{background:var(--panel);padding:130px 20px;text-align:center;margin:50px 0;width:100vw;position:relative;left:50%;right:50%;margin-left:-50vw;margin-right:-50vw;}
.banner.dark{background:linear-gradient(rgba(20,10,10,.55),rgba(20,10,10,.55)), var(--img-banner,none) center/cover no-repeat #2A1818;color:#fff;position:relative;}
.banner.dark .btn{border-color:#fff;color:#fff;}
.banner h2{font-size:22px;margin:6px 0 14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;}
.banner p{font-size:12px;color:var(--muted);max-width:420px;margin:0 auto 20px;}
.banner.dark p{color:#e8dfd3;}
.bouquets{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;margin:50px 0;}
@media(max-width:640px){.bouquets{grid-template-columns:1fr;}}
.bouquets .thumb{height:260px;}
.crumb{font-size:10px;color:var(--muted);margin:20px 0;letter-spacing:.5px;}
.product-view{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin:20px 0 50px;}
@media(max-width:600px){.product-view{grid-template-columns:1fr;}}
.product-view h2{font-size:22px;margin:0 0 4px;font-weight:400;}
.p-price{color:var(--accent);margin:0 0 16px;font-size:14px;}
.p-desc{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:16px;}
input,textarea,select{width:100%;font-size:13px;padding:10px;border:0.5px solid var(--line);border-radius:2px;background:var(--bg);color:var(--ink);margin-bottom:12px;font-family:'Cinzel',serif;}
label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase;}
.cart-line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:0.5px solid var(--line);font-size:13px;}
.cart-line button{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;}
.total{display:flex;justify-content:space-between;font-size:14px;font-weight:600;padding:16px 0;}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:50px 0;}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 22px;font-size:12px;letter-spacing:.5px;border-radius:30px;opacity:0;pointer-events:none;transition:all .3s ease;z-index:300;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}
#toast.show{opacity:1;transform:translate(-50%,0);}
.qty{display:flex;align-items:center;gap:8px;}
.qty button{width:24px;height:24px;border:0.5px solid var(--line);background:none;color:var(--ink);cursor:pointer;}
.social-row{text-align:center;padding:40px 0 10px;}
.social-row .kicker{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:14px;}
.social-icons{display:flex;justify-content:center;gap:16px;}
.social-icons a{width:34px;height:34px;border:0.5px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;text-align:center;margin:30px 0 10px;font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);}
@media(max-width:600px){.features{grid-template-columns:repeat(2,1fr);}}
.newsletter{background:var(--gold);color:#fff;padding:26px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
.newsletter form{display:flex;gap:0;max-width:320px;flex:1;}
@media(max-width:480px){.newsletter{flex-direction:column;text-align:center;}.newsletter form{max-width:100%;width:100%;}.newsletter input{flex:1;}}
.newsletter input{margin:0;background:#fff;border:none;color:var(--ink);}
.newsletter button{background:var(--ink);color:#fff;border:none;padding:0 18px;font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.foot-cols{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px;padding:40px 24px 20px;font-size:11px;}
@media(max-width:700px){.foot-cols{grid-template-columns:1fr 1fr;}}
@media(max-width:460px){.foot-cols{grid-template-columns:1fr;text-align:center;}}
.foot-cols h4{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;}
.foot-cols a{display:block;color:var(--muted);margin-bottom:8px;}
.foot-cols a:hover{color:var(--accent);}
.foot-bottom{border-top:0.5px solid var(--line);text-align:center;font-size:10px;color:var(--muted);padding:16px;letter-spacing:.5px;}
.admin-row{display:flex;justify-content:space-between;align-items:center;border-bottom:0.5px solid var(--line);padding:10px 0;font-size:12px;}
.admin-row button{background:none;border:0.5px solid var(--line);padding:4px 10px;font-size:10px;cursor:pointer;color:var(--muted);}
.notice{background:var(--panel);padding:10px 16px;font-size:11px;color:var(--muted);margin:16px 0;border-left:2px solid var(--accent);}
#cookie-banner{position:fixed;bottom:0;left:0;right:0;background:var(--ink);color:#fff;padding:16px 20px;display:flex;justify-content:center;gap:16px;align-items:center;flex-wrap:wrap;font-size:11px;z-index:200;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));}
#cookie-banner button{border:none;padding:8px 18px;font-size:10px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border-radius:20px;}
#cookie-banner .accept{background:var(--accent);color:#fff;}
#cookie-banner .decline{background:transparent;color:#fff;border:1px solid #fff;}
.notfound{text-align:center;padding:90px 20px;}
.notfound .num{font-family:'Allura',cursive;font-size:70px;color:var(--accent);}
body{overflow-x:clip;}
.mark{font-family:'Allura',cursive;font-size:20px;color:var(--muted);opacity:.45;text-align:center;}
.page-text{max-width:620px;margin:0 auto 60px;font-size:13px;color:var(--muted);line-height:1.9;}
.page-text p{margin:0 0 16px;}
.page-text h3{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--ink);margin:28px 0 8px;font-weight:600;}
.faq{max-width:680px;margin:30px auto 40px;}
.faq details{border-bottom:0.5px solid var(--line);padding:16px 4px;}
.faq summary{cursor:pointer;font-size:13px;letter-spacing:.3px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;}
.faq summary::-webkit-details-marker{display:none;}
.faq summary::after{content:"+";color:var(--accent);font-size:20px;line-height:1;}
.faq details[open] summary::after{content:"–";}
.faq details p{margin:12px 0 0;font-size:12px;color:var(--muted);line-height:1.9;}
</style>''

function showToast(text) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; document.body.appendChild(t); }
  t.textContent = text; t.className = "show";
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.className = ""; }, 2600);
}

// ----- Panier -----
function addToCart(id) {
  const c = getCart(); const l = c.find(i => i.id === id);
  if (l) l.qty++; else c.push({ id, qty: 1 });
  setCart(c); render(false); showToast("Article ajouté au panier ✓");
}
function changeQty(id, delta) {
  const c = getCart().map(i => i.id === id ? { ...i, qty: Math.max(0, i.qty + delta) } : i).filter(i => i.qty > 0);
  setCart(c); render(false);
}

function stripHTML() {
  const products = getProducts();
  if (products.length === 0) {
    return `<div class="strip-wrap"><div class="strip" style="animation:none;width:auto;justify-content:center;flex-wrap:wrap;">${Array.from({ length: 6 }).map(() => `<div class="thumb">${MARQUE}</div>`).join("")}</div></div>`;
  }
  const item = p => `<a href="#/produit/${esc(p.id)}" class="thumb" style="display:flex;">${thumbHTML(p.photo, p.nom)}</a>`;
  // 1 ou 2 produits : trop peu pour défiler sans répéter la même photo à la suite
  if (products.length < 3) {
    return `<div class="strip-wrap"><div class="strip" style="animation:none;width:auto;justify-content:center;flex-wrap:wrap;">${products.map(item).join("")}</div></div>`;
  }
  // On répète la liste jusqu'à remplir la largeur d'un écran, puis on la double pour une boucle sans coupure
  let base = [...products];
  while (base.length < 10) base = base.concat(products);
  const loop = [...base, ...base];
  const duration = Math.round(base.length * 2.6);
  return `<div class="strip-wrap"><div class="strip" style="animation-duration:${duration}s;">${loop.map(item).join("")}</div></div>`;
}

async function saveOrderToSupabase(nom, tel, ville, lignes, total) {
  if (!sb) return;
  try {
    const details = lignes.map(({ i, p }) => ({ produit_id: p.id, quantite: i.qty, prix_unitaire: p.prix }));
    const { error } = await sb.rpc("enregistrer_commande", { p_nom: nom, p_telephone: tel, p_ville: ville, p_total: total, p_lignes: details });
    if (error) console.warn("Supabase (commande) :", error);
  } catch (e) { console.warn("Supabase (commande) :", e); }
}

function submitOrder() {
  const form = document.getElementById("order-form");
  if (!form || !form.reportValidity()) return;
  const data = new FormData(form);
  if (data.get("website")) return;
  const products = getProducts();
  const lignes = getCart().map(i => ({ i, p: products.find(x => x.id === i.id) })).filter(l => l.p);
  if (lignes.length === 0) { showToast("Votre panier est vide ou ses articles ne sont plus disponibles."); return; }
  let total = 0;
  const lines = lignes.map(({ i, p }) => { total += p.prix * i.qty; return `- ${p.nom} x${i.qty} (${fmt(p.prix * i.qty)})`; }).join("\n");
  const msg = `Nouvelle commande — Precious Hands\n\nClient: ${data.get("nom")}\nTéléphone: ${data.get("tel")}\nVille/Adresse: ${data.get("ville")}\nLivraison: ${data.get("livraison")}\n\nArticles:\n${lines}\n\nTotal: ${fmt(total)}`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  const fenetre = window.open(url, "_blank");
  const enregistrement = saveOrderToSupabase(data.get("nom"), data.get("tel"), data.get("ville"), lignes, total);
  // Si le navigateur a bloqué l'ouverture de WhatsApp, on y va directement une fois la commande enregistrée
  if (!fenetre) enregistrement.finally(() => { location.href = url; });
  setCart([]); location.hash = "#/";
  showToast("Merci ! Terminez l'envoi dans WhatsApp ✓");
}

  return `<p class="section-title" style="margin-top:40px;">${title}</p>

    <label>Nom</label><input required name="nom">

    ${extra}
    <a class="btn solid" style="display:block;text-align:center;margin-top:8px;" onclick="submitRequest('${type}')">Envoyer sur WhatsApp</a>
  </form>`;
}

async function saveRequestToSupabase(type, nom, tel, description, occasion) {
  if (!sb) return;
  try {
    const { error } = await sb.rpc("enregistrer_demande", {
      p_type: type, p_nom: nom, p_telephone: tel,
      p_description: description || "", p_occasion: occasion || ""
    });
    if (error) console.warn("Supabase (demande) :", error);
  } catch (e) { console.warn("Supabase (demande) :", e); }
}

function submitRequest(type) {
  const form = document.getElementById("req-form");
  if (!form || !form.reportValidity()) return;
  const data = new FormData(form);
  if (data.get("website")) return;
  const titre = type === "bouquet" ? "Demande de bouquet de fleurs" : "Demande de bijou personnalisé";
  let msg = `${titre} — Precious Hands\n\nNom: ${data.get("nom")}\nTéléphone: ${data.get("tel")}`;
  if (data.get("description")) msg += `\nDescription: ${data.get("description")}`;
  if (data.get("occasion")) msg += `\nOccasion: ${data.get("occasion")}`;
  const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  const fenetre = window.open(url, "_blank");
  const enregistrement = saveRequestToSupabase(type, data.get("nom"), data.get("tel"), data.get("description"), data.get("occasion"));
  if (!fenetre) enregistrement.finally(() => { location.href = url; });
  location.hash = "#/";
  showToast("Merci ! Terminez l'envoi dans WhatsApp ✓");
}

// Réduit la photo (1400 px max, JPEG) : les photos de téléphone pèsent plusieurs Mo et ralentiraient le site.
async function reduireImage(fichier, maxSide = 1400, qualite = 0.85) {
  try {
    const bmp = await createImageBitmap(fichier);
    const ratio = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(bmp.width * ratio);
    canvas.height = Math.round(bmp.height * ratio);
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, canvas.width, canvas.height); // fond blanc (PNG transparents)
    ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", qualite));
    return blob || fichier;
  } catch (e) { return fichier; }
}
const blobEnDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });

async function addProduct() {
  if (enregistrementEnCours) return;
  const form = document.getElementById("add-form");
  if (!form.reportValidity()) return;
  const data = new FormData(form);
  const fichier = form.querySelector('input[type="file"]').files[0];
  const categories = Array.from(form.querySelectorAll('input[name="categories"]:checked')).map(el => el.value);
  enregistrementEnCours = true;
  showToast("Enregistrement en cours…");
  try {
    const photoBlob = fichier ? await reduireImage(fichier) : null;
    const product = {
      id: crypto.randomUUID(), nom: data.get("nom").trim(), prix: Number(data.get("prix")),
      categories: categories.length ? categories : ["Femme"], sousCategorie: data.get("sousCategorie"),
      matiere: data.get("matiere").trim(), description: data.get("description").trim(), photo: null
    };
    if (!sb) { // mode local, sans Supabase
      product.photo = photoBlob ? await blobEnDataUrl(photoBlob) : null;
      setProducts([...getProducts(), product]); render(false);
      showToast("Produit ajouté (mode local) ✓");
      return;
    }
    let photoUrl = null;
    if (photoBlob) {
      const ext = photoBlob.type === "image/jpeg" ? "jpg" : ((fichier.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg");
      const chemin = `${product.id}.${ext}`;
      const { error: upErr } = await sb.storage.from("photos-produits").upload(chemin, photoBlob, { contentType: photoBlob.type || fichier.type });
      if (upErr) { console.warn("Supabase (photo) :", upErr); showToast("La photo n'a pas pu être envoyée : produit non enregistré."); return; }
      photoUrl = sb.storage.from("photos-produits").getPublicUrl(chemin).data.publicUrl;
    }
    const { error: insErr } = await sb.from("produits").insert({
      id: product.id, nom: product.nom, prix: product.prix, matiere: product.matiere,
      description: product.description, image_url_1: photoUrl,
      sous_categorie: product.sousCategorie, categories: product.categories
    });
    if (insErr) { console.warn("Supabase (produit) :", insErr); showToast("Produit non enregistré (voir la console)."); return; }
    await syncProductsFromSupabase();
    showToast("Produit enregistré ✓");
  } catch (e) {
    console.warn("Produit :", e); showToast("Une erreur est survenue (voir la console).");
  } finally { enregistrementEnCours = false; }
}

async function deleteProduct(id) {
  if (!confirm("Supprimer ce produit ?")) return;
  if (sb) {
    const { data, error } = await sb.from("produits").delete().eq("id", id).select();
    if (error) {
      console.warn("Supabase (suppression) :", error);
      showToast(error.code === "23503" ? "Impossible : ce produit figure dans une commande." : "Suppression impossible (voir la console).");
      return;
    }
    if (!data || data.length === 0) { showToast("Suppression non autorisée : reconnectez-vous."); return; }
  }
  setProducts(getProducts().filter(p => p.id !== id));
  setCart(getCart().filter(i => i.id !== id));
  render(false);
  showToast("Produit supprimé ✓");
}

async function syncProductsFromSupabase() {
  if (!sb) { produitsCharges = true; return; }
  try {
    let res = await sb.from("produits").select("*").order("date_ajout", { ascending: false });
    if (res.error) res = await sb.from("produits").select("*");
    if (res.error || !res.data) { console.warn("Supabase (sync) :", res.error); return; }
    const produits = res.data.map(p => ({
      id: p.id, nom: p.nom, prix: p.prix, categories: p.categories || [],
      sousCategorie: p.sous_categorie || "", matiere: p.matiere, description: p.description, photo: p.image_url_1
    }));
    setProducts(produits);
    const panier = getCart(); // retire du panier les articles qui n'existent plus
    const panierOk = panier.filter(i => produits.some(p => p.id === i.id));
    if (panierOk.length !== panier.length) setCart(panierOk);
  } catch (e) { console.warn("Supabase (sync produits) :", e); }
  finally {
    produitsCharges = true;
    const ae = document.activeElement;
    const saisie = ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
    if (!saisie) render(false); // ne pas effacer ce que le visiteur est en train de taper
  }
}

function buildNav() {

function toggleNav() { document.getElementById("main-nav").classList.toggle("open"); }

function render(scroll = true) {
  updateCartCount();
  const hash = location.hash || "#/";
  const [path, query] = hash.slice(1).split("?");
  const params = new URLSearchParams(query || "");
  // Seules les valeurs connues sont acceptées dans l'adresse (évite l'injection de code par un lien piégé)
  const cat = CATEGORIES.includes(params.get("cat")) ? params.get("cat") : "";
  const sub = SOUS_CATEGORIES.some(s => s.nom === params.get("sub")) ? params.get("sub") : "";
  let html = "", titre = "";

  if (path === "/" || path === "") { html = homeView(); }
  else if (path === "/collections") { html = collectionsView(cat, sub); titre = sub || (cat ? catTitre(cat) : "Collections"); }
  else if (path.startsWith("/produit/")) {
    const id = path.split("/")[2];
    const p = getProducts().find(x => x.id === id);
    html = productView(id); titre = p ? p.nom : "Produit";
  }
  else if (path === "/panier") { html = cartView(); titre = "Panier"; }
  else if (path === "/commande") { html = commandeView(); titre = "Commande"; }
  else if (path === "/personnalise") { html = personnaliseView(); titre = "Bijoux personnalisés"; }
  else if (path === "/bouquets") { html = bouquetsView(); titre = "Bouquets de fleurs"; }
  else if (path === "/contact") { html = contactView(); titre = "Contact"; }
  else if (path === "/histoire") { html = histoireView(); titre = "Notre histoire"; }
  else if (path === "/savoir-faire") { html = savoirFaireView(); titre = "Savoir-faire"; }
  else if (path === "/livraison") { html = livraisonView(); titre = "Livraison & retours"; }
  else if (path === "/faq") { html = faqView(); titre = "FAQ"; }
  else if (path === "/admin") { html = adminPage(); titre = "Espace admin"; }
  else { html = notFoundView(); titre = "Page introuvable"; }

  document.getElementById("app").innerHTML = html;
  document.getElementById("bottom-sections").innerHTML = bottomSectionsHTML();
  document.title = titre ? `${titre} — Precious Hands` : "Precious Hands — Bijoux faits main";
  document.querySelectorAll("#main-nav a").forEach(a => a.classList.toggle("active", !!a.dataset.cat && a.dataset.cat === cat));
  if (scroll) window.scrollTo(0, 0);
}

function setCookieConsent(val) {
  try { localStorage.setItem("ph_cookie_consent", val ? "accepted" : "declined"); } catch (e) {}
  document.getElementById("cookie-banner").style.display = "none";
  if (val) loadAnalytics();
}
function initCookieBanner() {
  let consent; try { consent = localStorage.getItem("ph_cookie_consent"); } catch (e) {}
  if (!consent) document.getElementById("cookie-banner").style.display = "flex";
  else if (consent === "accepted") loadAnalytics();
}
function loadAnalytics() {
  if (!ANALYTICS_PROVIDER || !ANALYTICS_ID) return;
  if (ANALYTICS_PROVIDER === "plausible") {
    const s = document.createElement("script"); s.defer = true; s.dataset.domain = ANALYTICS_ID; s.src = "https://plausible.io/js/script.js";
    document.head.appendChild(s);
  } else if (ANALYTICS_PROVIDER === "ga4") {
    const s = document.createElement("script"); s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + ANALYTICS_ID;
    document.head.appendChild(s);
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date()); gtag("config", ANALYTICS_ID);
  }
}
